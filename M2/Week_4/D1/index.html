<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Job</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <header>
            <p>JOB FINDER</p>
            <h1 id="titleSite">Find your next job</h1>
            <h3>Filter by position and location to see matching offers</h3>
        </header>
        
        <section id="searchBox">
            <div class="searchInput">
                <p>Job position</p>       
                <input id="jobWord" type="text" placeholder="Insert Job">
            </div>
            <div class="searchInput">
                <p>Location</p>
                <input id="locationWord" type="text" placeholder="Insert location">
            </div>
            <button id="btn">Search</button>
        </section>

        <div id="count"></div>
        <div id="tableResult">
            <ul id="lista">
        
            </ul>
        </div>
    </main>


    <script src="./scaricabile.js"></script>
</body>
</html>
