<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Page</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo_header">
            <img src="/assets/logo.png" alt="Logo-Amazon">
        </div>

        <nav>
            <ul>
                <li>All</li>
                <li>Todays deals</li>
                <li>Customer Service</li>
                <li>Registry</li>
                <li>Gift Cards</li>
                <li>Sell</li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="band_card">
            <p>Shop All Holiday Gift Cards</p>
        </div>
        <div class="title_page">
            <h1>Holiday Gift Guides</h1>
            <h3>Be a go-gifter</h3>
            <img src="/assets/bg-image.png" alt="banda_verde">
        </div>

        <p>Find the perfect gift</p>

        <div class="multi_object">
            <img src="/assets/img_1.jpg" alt="foto_tablet">
            <img src="/assets/img_2.jpg" alt="foto_pc">
            <img src="/assets/img_3.jpg" alt="foto_orologi">
            <img src="/assets/img_4.jpg" alt="foto_animali">

        </div>
        <div class="categoria">
            <figure>
                <img src="/assets/img_9.png" alt="foto_visore">
            </figure>
        </div>
        <div class="categoria">
            <figure>
                <img src="/assets/img_10.png" alt="foto_casse">
            </figure>
        </div>

    </main>

    <footer>
        <p>Back to top</p>
        <div class="footer_logo">
            <img src="/assets/logo.png" alt="">
        </div>
    </footer>
    
</body>
</html>
