<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Pinterest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="card">
        <img src="assets/foto_natale.avif" alt="foto_di_natale">

        <button id="save_button">
            Save
        </button>

        <div id="button_bar">
            <button id="link_botton">
                Visit
            </button>

            <button id="upload_botton">
                <img src="assets/upload.png" alt="immagine_upload">
            </button>

            <button id="option">
                <img src="assets/option.png" alt="immagine_opzioni">
            </button>
        </div>
    </div>

    
</body>
</html>
